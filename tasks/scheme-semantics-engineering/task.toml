schema_version = "1.3"
artifacts = ["/app"]

[task]
name = "nuprl/scheme-semantics-engineering"
description = "Relate independent Mini-Scheme static and small-step semantics to a fuel interpreter"
keywords = ["programming-languages", "lean", "scheme", "operational-semantics", "proof-assistant"]

[[task.authors]]
name = "Arjun Guha"
email = "a.guha@northeastern.edu"

[metadata]
category = "programming-languages"
difficulty = "hard"

[verifier]
timeout_sec = 1800.0

[verifier.env]
CODEX_AUTH_JSON = "${CODEX_AUTH_JSON}"
CODEX_ACCESS_TOKEN = "${CODEX_ACCESS_TOKEN:-}"

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 8192
